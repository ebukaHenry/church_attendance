{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Church Organogram</h2>

<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h5>Hierarchy Overview</h5>
                <ul class="list-group">
                    {% for item in hierarchy %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ item.department }}</strong> → {{ item.role }}
                        </div>
                        <span class="badge bg-primary rounded-pill">{{ item.count }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
    
    <div class="col-lg-4">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="display-4 text-success">{{ hierarchy|sum(attribute='count') if hierarchy else 0 }}</h1>
                <p class="text-muted">Total in Hierarchy</p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
