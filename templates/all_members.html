{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">All Church Members</h2>

<div class="mb-3">
    <input type="text" id="searchInput" class="form-control" placeholder="Search by name or phone..." onkeyup="searchTable()">
</div>

<div class="table-responsive">
    <table class="table table-hover" id="membersTable">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Total Attendance</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member.name }}</td>
                <td>{{ member.phone }}</td>
                <td><span class="badge bg-{{ 'primary' if member.gender == 'Male' else 'danger' }}">{{ member.gender }}</span></td>
                <td><strong>{{ member.total_attendance }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
function searchTable() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let rows = document.querySelectorAll("#membersTable tbody tr");
    rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(input) ? "" : "none";
    });
}
</script>

{% endblock %}
