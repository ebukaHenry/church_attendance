{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white text-center">
                <h4>Church Attendance</h4>
                <h5>{{ service_type }} - {{ service_date }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('submit_attendance') }}">
                    <input type="hidden" name="service_date" value="{{ service_date }}">
                    <input type="hidden" name="service_type" value="{{ service_type }}">

                    <div class="text-center mb-4">
                        <p class="lead">Are you attending this service?</p>
                        <button type="button" class="btn btn-primary btn-lg mx-2" onclick="showNewForm()">
                            First Time
                        </button>
                        <button type="button" class="btn btn-secondary btn-lg mx-2" onclick="showOldForm()">
                            Regular Member
                        </button>
                    </div>

                    <!-- Old Member Form -->
                    <div id="oldForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="08012345678" required>
                        </div>
                        <button type="submit" name="is_new" value="false" class="btn btn-success w-100">Mark Attendance</button>
                    </div>

                    <!-- New Member Form -->
                    <div id="newForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <button type="submit" name="is_new" value="true" class="btn btn-success w-100">Submit & Mark Attendance</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function showNewForm() {
    document.getElementById('newForm').classList.remove('d-none');
    document.getElementById('oldForm').classList.add('d-none');
}
function showOldForm() {
    document.getElementById('oldForm').classList.remove('d-none');
    document.getElementById('newForm').classList.add('d-none');
}
</script>

{% endblock %}
